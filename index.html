<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>たい焼き名店記録</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff; --ink:#202124; --sub:#5f6368; --accent:#1a73e8; --accent-bg:#e8f0fe; --line:#dadce0; --shadow:0 1px 2px #3c40434d, 0 2px 6px 2px #3c404326; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:Roboto,"Noto Sans JP","Hiragino Sans","Meiryo",sans-serif; color:var(--ink); background:var(--bg); }
  #map { position:absolute; inset:0; }
  button { cursor:pointer; border:0; border-radius:8px; padding:8px 14px; background:var(--accent); color:#fff; font-weight:500; font-size:14px; font-family:inherit; }
  button:hover { filter:brightness(.95); }
  button.sub { background:#fff; color:var(--accent); border:1px solid var(--line); }
  button.on { background:var(--accent-bg); color:#1967d2; border-color:var(--accent); }
  button.icon { background:none; color:var(--sub); padding:0; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; flex:none; }
  button.icon:hover { background:#f1f3f4; }
  svg { fill:currentColor; width:24px; height:24px; }

  /* 検索バー(Googleマップ風の浮かぶカード) */
  #topbar { position:absolute; z-index:1000; top:12px; left:12px; width:min(392px, calc(100% - 24px)); height:48px; display:flex; align-items:center; background:#fff; border-radius:24px; box-shadow:var(--shadow); padding:0 2px; }
  #topbar input { flex:1; min-width:0; border:0; outline:0; font-size:16px; font-family:inherit; background:none; padding:0 4px; color:var(--ink); }
  #topbar input::-webkit-search-cancel-button { display:none; }
  #placebtn { color:var(--accent); }

  /* 絞り込みチップ */
  #chips { position:absolute; z-index:900; top:66px; left:12px; right:12px; display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none; }
  #chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:16px; border:1px solid var(--line); background:#fff; color:var(--ink); font-size:14px; font-weight:400; box-shadow:0 1px 2px #3c40434d; }
  .chip::before { content:""; width:10px; height:10px; border-radius:50%; background:var(--c); }
  .chip.on { background:var(--accent-bg); border-color:var(--accent); color:#1967d2; }
  .chip:hover { filter:none; background:#f8f9fa; }
  .chip.on:hover { background:var(--accent-bg); }
  @media (min-width:701px) { #chips { top:19px; left:416px; right:70px; } }

  /* 右下の丸いボタン */
  #fabs { position:absolute; z-index:900; right:12px; bottom:96px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .fab { width:48px; height:48px; padding:0; border-radius:50%; background:#fff; color:var(--sub); box-shadow:var(--shadow); display:grid; place-items:center; }
  .fab:hover { background:#f8f9fa; filter:none; }
  #fabs { align-items:flex-end; }
  .fab.primary { width:auto; height:56px; padding:0 22px 0 16px; gap:8px; background:var(--accent); color:#fff; border-radius:28px; grid-auto-flow:column; font-size:15px; font-weight:500; }
  #addmenu { display:none; flex-direction:column; align-items:flex-end; gap:10px; }
  #addmenu.open { display:flex; }
  #addmenu button { display:flex; align-items:center; gap:10px; padding:10px 18px 10px 14px; border-radius:24px; background:#fff; color:var(--ink); border:0; box-shadow:var(--shadow); font-size:15px; white-space:nowrap; }
  #addmenu button:hover { background:#f8f9fa; filter:none; }
  #addmenu .ic { font-size:20px; line-height:1; }
  #hint button { margin-left:10px; padding:2px 10px; border-radius:12px; background:#fff; color:#3c4043; font-size:13px; }
  .fab.primary:hover { background:#1765cc; }
  .fab svg { width:26px; height:26px; }
  .leaflet-bottom.leaflet-right .leaflet-control-zoom { margin-bottom:14px; }

  /* メニュー(PCは左のパネル・スマホは下から出るシート) */
  #drawer { position:fixed; z-index:1100; top:0; bottom:0; left:0; width:min(380px,100%); background:#fff; box-shadow:var(--shadow); display:flex; flex-direction:column; transform:translateX(-105%); transition:transform .25s ease; }
  #drawer.open { transform:none; }
  .dh { display:flex; align-items:center; justify-content:space-between; padding:6px 6px 6px 18px; border-bottom:1px solid var(--line); font-size:18px; }
  .dq { padding:12px 16px 4px; }
  .dq input { width:100%; padding:10px 14px; border:1px solid var(--line); border-radius:24px; font:inherit; font-size:15px; outline-color:var(--accent); }
  .acts { display:flex; flex-wrap:wrap; gap:8px; padding:10px 16px 12px; border-bottom:1px solid var(--line); }
  .acts button { padding:6px 12px; font-size:13px; border-radius:16px; }
  #list { flex:1; overflow:auto; }
  .item { padding:12px 16px; border-bottom:1px solid #f1f3f4; cursor:pointer; display:flex; gap:12px; align-items:center; }
  .item:hover { background:#f8f9fa; }
  .item img { width:56px; height:56px; object-fit:cover; border-radius:8px; }
  .item b { display:block; font-size:15px; font-weight:500; }
  .item small { color:var(--sub); font-size:13px; }
  .item .dist { color:var(--accent); font-weight:500; margin-left:6px; }

  /* ピン・ポップアップ */
  .taiyaki-pin { position:relative; width:96px; height:59px; filter:drop-shadow(0 2px 3px #0008); }
  .taiyaki-pin svg { position:absolute; top:0; left:0; width:96px; height:59px; }   /* 画面全体の「svgは24px」設定より優先 */
  .taiyaki-pin.want { opacity:.55; }
  .taiyaki-pin.want svg .outline { stroke-dasharray:4 3; }
  .leaflet-popup-content-wrapper { border-radius:12px; box-shadow:var(--shadow); }
  .leaflet-popup-content { font-family:inherit; margin:12px 14px; }
  .popup b { font-size:16px; font-weight:500; }
  .popup img { width:100%; max-height:140px; object-fit:cover; border-radius:8px; margin:6px 0; }
  .popup .row { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 6px; }
  .popup .row button { padding:6px 12px; border-radius:16px; font-size:13px; }
  .popup a { color:var(--accent); text-decoration:none; font-size:13px; }
  .me { width:16px; height:16px; background:#1a73e8; border:3px solid #fff; border-radius:50%; box-shadow:0 0 0 6px #1a73e833; }

  /* ルート・距離のパネル */
  #panel { position:absolute; z-index:900; left:12px; bottom:32px; background:#fff; border-radius:12px; box-shadow:var(--shadow); padding:12px 14px; font-size:14px; display:none; max-width:min(340px,calc(100% - 96px)); }
  #panel .modes { display:flex; gap:6px; margin:8px 0; }
  #panel .modes button { flex:1; padding:6px 4px; font-size:13px; border-radius:16px; }
  .stn { width:14px; height:14px; border-radius:50%; background:#fff; border:3px solid #455a64; box-shadow:0 1px 3px #0005; }
  .stn-label { background:#fffffff2; border:1px solid #455a64; border-radius:4px; color:#263238; font-size:12px; font-weight:500; padding:1px 5px; box-shadow:none; }
  .stn-label::before { display:none; }
  #toast { position:absolute; z-index:1200; left:50%; bottom:28px; transform:translate(-50%,20px); background:#3c4043; color:#fff; padding:10px 18px; border-radius:8px; font-size:14px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:.25s; max-width:calc(100% - 32px); text-align:center; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  #hint { position:absolute; z-index:950; left:50%; top:112px; transform:translateX(-50%); background:#3c4043; color:#fff; padding:8px 16px; border-radius:4px; font-size:14px; display:none; box-shadow:var(--shadow); }

  /* 登録ダイアログ */
  dialog { border:0; border-radius:16px; padding:22px; width:min(440px,92vw); box-shadow:0 8px 30px #0005; font-family:inherit; }
  dialog h3 { margin:0 0 6px; font-weight:500; font-size:20px; }
  dialog label { display:block; margin:12px 0 4px; font-size:13px; color:var(--sub); }
  dialog input, dialog select, dialog textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; outline-color:var(--accent); }

  @media (max-width:700px) {
    #drawer { top:auto; left:0; right:0; width:auto; height:64vh; border-radius:16px 16px 0 0; transform:translateY(105%); }
    #drawer.open { transform:none; }
    .leaflet-control-zoom { display:none; }
    #fabs { bottom:32px; }
    #panel { right:12px; max-width:none; bottom:104px; }
    .stn { width:14px; height:14px; border-radius:50%; background:#fff; border:3px solid #455a64; box-shadow:0 1px 3px #0005; }
  .stn-label { background:#fffffff2; border:1px solid #455a64; border-radius:4px; color:#263238; font-size:12px; font-weight:500; padding:1px 5px; box-shadow:none; }
  .stn-label::before { display:none; }
  #toast { position:absolute; z-index:1200; left:50%; bottom:28px; transform:translate(-50%,20px); background:#3c4043; color:#fff; padding:10px 18px; border-radius:8px; font-size:14px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:.25s; max-width:calc(100% - 32px); text-align:center; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  #hint { top:118px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="topbar">
  <button class="icon" id="menu" aria-label="メニュー"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
  <input id="place" type="search" placeholder="住所・駅名を検索">
  <button class="icon" id="placebtn" aria-label="検索"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
</div>
<div id="chips"></div>

<div id="fabs">
  <div id="addmenu">
    <button id="addSearch"><span class="ic">🔍</span>住所・駅名から探して登録</button>
    <button id="addMap"><span class="ic">📍</span>地図で場所を選んで登録</button>
    <button id="addHere"><span class="ic">🎯</span>いまいる場所で登録</button>
  </div>
  <button class="fab" id="locate" title="現在地" aria-label="現在地"><svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg></button>
  <button class="fab primary" id="add" title="お店を追加" aria-label="お店を追加"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>お店を追加</button>
</div>
<div id="panel"></div>
<div id="toast" role="status"></div>
<div id="hint"><span>地図をタップして場所を選んでください</span><button id="hintx">やめる</button></div>

<aside id="drawer">
  <div class="dh"><b>🐟 たい焼き名店記録</b><button class="icon" id="close" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div>
  <div id="authRow" style="padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px"></div>
  <div class="dq"><input id="q" type="search" placeholder="保存した店を検索"></div>
  <div class="acts">
    <button class="sub" id="rankBtn">🏆 ランキング</button>
    <button class="sub" data-line="pref" title="都道府県の境界線(濃い赤)">県境</button>
    <button class="sub" id="stnBtn" title="各市区の主要駅を目印として表示します(ズーム11以上で駅名も表示)">主要駅</button>
    <button class="sub" data-line="city" title="市区町村の境界線(オンにするとタイル量が増え、少し重くなります)">市区町村界</button>
    <button class="sub" id="track">現在地を追う</button>
    <button class="sub" id="near">近い順</button>
    <button class="sub" id="measure">距離を測る</button>
    <button class="sub" id="export">書き出し</button>
    <button class="sub" id="import">読み込み</button>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
  <div id="rankBox" style="display:none; border-bottom:1px solid var(--line);"></div>
  <div id="list"></div>
</aside>

<dialog id="loginDlg">
  <form method="dialog" id="loginForm">
    <h3>📧 メールでログイン</h3>
    <p style="color:var(--sub);font-size:14px;margin:0">パスワードは不要です。入力したメール宛に、ログイン用のリンクが届きます。</p>
    <label>メールアドレス</label><input id="loginEmail" type="email" required placeholder="example@mail.com">
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
      <button type="button" class="sub" id="loginCancel">閉じる</button>
      <button type="submit">リンクを送る</button>
    </div>
  </form>
</dialog>

<dialog id="profileDlg">
  <form method="dialog" id="profileForm">
    <h3>ニックネームを決めよう</h3>
    <p style="color:var(--sub);font-size:14px;margin:0">投稿・いいね・コメントに、この名前とアイコンが表示されます。</p>
    <label>ニックネーム</label><input id="pfNick" maxlength="20" required placeholder="例: たい焼き太郎">
    <label>アイコン</label>
    <div id="pfAvatars" style="display:flex;gap:8px;font-size:22px;margin-top:4px"></div>
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
      <button type="submit">はじめる</button>
    </div>
  </form>
</dialog>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dtitle">たい焼き店を追加</h3>
    <label>場所を探す(住所・店名)</label>
    <div style="display:flex;gap:6px"><input id="geo" placeholder="例: 渋谷 ラーメン"><button type="button" class="sub" id="geobtn">検索</button></div>
    <small id="geores" style="color:#777"></small>
    <label>店名 *</label><input id="name" required>
    <label>あんの種類</label><select id="genre"></select>
    <label>皮のタイプ</label><select id="skin"><option>薄皮</option><option>厚皮</option><option>もっちり</option></select>
    <label>価格(円)</label><input id="price" type="number" min="0" step="10" placeholder="例: 180">
    <label>評価</label>
    <select id="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
    <label>状態</label>
    <select id="status"><option value="visited">食べた</option><option value="want">食べたい</option></select>
    <label>ひとこと</label><textarea id="comment" rows="3" maxlength="200"></textarea>
    <label>写真</label><input id="photo" type="file" accept="image/*">
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
      <button type="button" class="sub" id="cancel">キャンセル</button>
      <button type="submit" id="save">保存</button>
    </div>
  </form>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.vectorgrid@1.3.0/dist/Leaflet.VectorGrid.bundled.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const GENRES = { "つぶあん":"#a1442c", "こしあん":"#6d4c41", "カスタード":"#f2a900", "白あん":"#8a9a5b", "変わり種":"#ae3ec9", "その他":"#495057" };
// ===== みんなの投稿を集める共有データベース(Supabase。無料枠で運用) =====
// 公開鍵(publishable key)は、みんなに見せるサイトに埋め込む前提の鍵。書き込みは各テーブルのRLS(行単位の許可設定)で
// 「自分の投稿だけ」に制限しているので、この鍵が見えても他人の投稿を書き換えることはできない。
const SUPA_URL = "https://selngdekcnoplgdsvqiu.supabase.co";
const SUPA_KEY = "sb_publishable_n8GSHYBDMZQFi4PTX6lvqw_L9MJUMxK";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
const AVATARS = ["🐟","🍰","🧁","🍡","🍙","😊","🎌","⭐"];

let shops = [];              // 共有DBから読み込んだお店(みんなに見える)
let profilesById = {};       // user_id -> {id,nickname,avatar}
let likesByShop = {};        // shop_id -> Set(user_id)
let commentCountByShop = {}; // shop_id -> 件数
let session = null;          // ログイン中のセッション(未ログインなら null)
let myProfile = null;        // 自分のニックネーム・アイコン
let activeGenres = new Set();
let pending = null;   // 追加/編集中 {lat,lng,id?}
let picking = false;
let photoData = "";
let pfAvatar = AVATARS[0];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// たい焼きの形のピン絵。体は「こんがり金色」で統一して一目でたい焼きと分かるようにし、
// あんの種類は体の中の色バッジ(c)で見分ける
const taiyakiSvg = c => `<svg width="96" height="59" viewBox="0 0 130 80">
  <path d="M22,52 L42,52 Q40,66 31,73 Q22,66 22,52 Z" fill="#f0b04d" stroke="#8a5220" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#8a522066" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M27,54 L27,66"/><path d="M32,54 L31,70"/><path d="M37,54 L35,66"/></g>
  <path class="outline" d="M6,38 C6,24 22,14 44,14 C48,6 60,3 72,14 C80,18 86,26 90,33 L114,10 Q104,38 114,66 L90,45 C82,54 66,62 44,62 C22,62 6,52 6,38 Z" fill="#f0b04d" stroke="#8a5220" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M14,34 C16,24 28,19 44,18 C60,17 74,22 84,32 C70,26 40,26 14,34 Z" fill="#ffffff55"/>
  <g stroke="#8a522088" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M52,12 L53,6"/><path d="M59,11 L61,5"/><path d="M66,12 L69,7"/>
    <path d="M42,20 Q34,38 42,58"/><path d="M58,16 Q50,38 58,60"/><path d="M74,20 Q66,38 74,54"/>
    <path d="M95,35 L110,17"/><path d="M96,39 L111,39"/><path d="M95,43 L110,61"/>
    <path d="M9,43 Q15,47 21,44"/>
  </g>
  <circle cx="20" cy="31" r="5" fill="#3b2a1e"/><circle cx="21.6" cy="29.4" r="1.6" fill="#fff"/>
  <circle cx="54" cy="42" r="10" fill="${c}" stroke="#fff" stroke-width="3"/>
</svg>`;

const map = L.map("map", { zoomControl:false }).setView([35.68, 139.72], 12);
L.control.zoom({ position:"bottomright" }).addTo(map);
const gsi = (k, ext) => L.tileLayer(`https://cyberjapandata.gsi.go.jp/xyz/${k}/{z}/{x}/{y}.${ext}`, { maxZoom:18, attribution:"<a href='https://maps.gsi.go.jp/development/ichiran.html'>地理院タイル</a>" });
const base = { "地図": gsi("std","png"), "淡色": gsi("pale","png"), "航空写真": gsi("seamlessphoto","jpg") };
base["地図"].addTo(map);
// 行政界: 国土地理院のベクトルタイル(キー不要)。紫=都道府県界 / 橙の実線=市町村界 / 橙の破線=区界
// ===== 境界線タイルの保存(案3)=====
// 一度読んだ境界線タイルをメモリと IndexedDB に保存し、次回から通信せずに出す(30日)。
const TILE_KEY = "/xyz/experimental_bvmap/", TILE_TTL = 30 * 864e5, TILE_MAX = 1500;
const tileMem = new Map();
// 保存先が応答しない場合(ブロック等)でも読み込みが止まらないよう、待ち時間の上限を設けて通信に切り替える
const within = (p, ms) => Promise.race([p, new Promise(ok => setTimeout(() => ok(null), ms))]);
const tileDB = within(new Promise(ok => { try { const r = indexedDB.open("shopmap-tiles", 1); r.onupgradeneeded = () => r.result.createObjectStore("t"); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); r.onblocked = () => ok(null); } catch { ok(null); } }), 2000);
const tileTx = async mode => { const db = await tileDB; return db ? db.transaction("t", mode).objectStore("t") : null; };
const tileGet = async k => { try { const st = await tileTx("readonly"); return st ? await within(new Promise(ok => { const q = st.get(k); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }), 1500) : null; } catch { return null; } };
const tilePut = async (k, blob) => { try { const st = await tileTx("readwrite"); st && st.put({ blob, time: Date.now() }, k); } catch {} };
(async () => {   // 起動時に古い・多すぎる保存分を掃除
  try {
    const st = await tileTx("readwrite"); if (!st) return; const rows = [];
    st.openCursor().onsuccess = e => {
      const c = e.target.result;
      if (c) { rows.push([c.key, c.value.time]); c.continue(); return; }
      rows.sort((a, b) => a[1] - b[1]);
      const drop = rows.filter((r, i) => Date.now() - r[1] > TILE_TTL || i < rows.length - TILE_MAX);
      drop.forEach(r => st.delete(r[0]));
    };
  } catch {}
})();
const rawFetch = window.fetch.bind(window);
window.fetch = async (input, init) => {
  const url = typeof input === "string" ? input : input.url;
  if (!url.includes(TILE_KEY)) return rawFetch(input, init);
  let blob = tileMem.get(url);
  if (!blob) { const rec = await tileGet(url); if (rec && Date.now() - rec.time < TILE_TTL) blob = rec.blob; }
  if (!blob) {
    const r = await rawFetch(input, init);
    if (!r.ok) return r;
    blob = await r.blob(); tilePut(url, blob);
  }
  tileMem.delete(url); tileMem.set(url, blob);
  if (tileMem.size > 400) tileMem.delete(tileMem.keys().next().value);
  return new Response(blob, { status: 200 });
};const HIDE = { stroke:false, fill:false, weight:0, opacity:0, fillOpacity:0 };
// 行政界: 県境・市区町村界は、ボタンでオンにしたときだけ読み込む(ズームの制限なし)
// (国土地理院のデータは 1211=都道府県界 / 1212=市区町村界 / 1221=海上の境界。市と区・町村を見分ける情報は無い)
// ズームの制限なし: 選んだ境界線は、どのズームでも表示する
// (国土地理院のデータは 1211=都道府県界 / 1212=市区町村界 / 1221=その他の区分。市と区を見分ける情報は無い)
const BVMAP = "https://cyberjapandata.gsi.go.jp/xyz/experimental_bvmap/{z}/{x}/{y}.pbf";
const adminLayer = (pick, extra = {}) => {
  const l = L.vectorGrid.protobuf(BVMAP, {
    maxNativeZoom:16, interactive:false,
    keepBuffer:6,              // 画面の外側のタイルを多めに保持(パン後すぐ出る)
    updateWhenIdle:false,      // 動かしている最中から読み込む
    updateWhenZooming:false,   // 拡大縮小の途中は描き直さず、前の線を引き伸ばして残す
    updateInterval:100,
    ...extra,
    vectorTileLayerStyles: new Proxy({}, { get: (_, name) => name !== "boundary" ? HIDE : ((p, z) => pick(Number(p.ftCode), z) || HIDE) })
  });
  const tb = l._getTiledPixelBounds;   // 画面より1タイル分外側まで先読み
  l._getTiledPixelBounds = function (c) { const b = tb.call(this, c); return L.bounds(b.min.subtract([256, 256]), b.max.add([256, 256])); };
  return l;
};
const prefLayer = adminLayer(c => c === 1211 && { weight:4, color:"#b71c1c", opacity:1, fill:false }, { maxNativeZoom: 15 });   // ズーム16以上でも県界が途切れないよう、ズーム15のタイルを拡大して使う
const cityLayer = adminLayer(c => c === 1212 && { weight:5, color:"#e65100", opacity:.6, fill:false }, { keepBuffer:3 });
// 境界線は選んだものだけ読み込む(最初はどちらもオフ=最も軽い)。選択は次回も覚える
const LINES_KEY = "shopmap.lines";
let linesOn = { pref:false, city:false };
try { Object.assign(linesOn, JSON.parse(localStorage.getItem(LINES_KEY)) || {}); } catch {}
if (linesOn.pref) prefLayer.addTo(map);
if (linesOn.city) cityLayer.addTo(map);
L.control.layers(base, { '<span style="color:#b71c1c">■</span> 県境': prefLayer, '<span style="color:#e65100">■</span> 市区町村界': cityLayer }, { position:"topright" }).addTo(map);
const syncLines = () => {
  linesOn = { pref: map.hasLayer(prefLayer), city: map.hasLayer(cityLayer) };
  try { localStorage.setItem(LINES_KEY, JSON.stringify(linesOn)); } catch {}
  document.querySelectorAll("[data-line]").forEach(b => b.classList.toggle("on", linesOn[b.dataset.line]));

map.on("overlayadd overlayremove", syncLines);
let toastT = null;
const toast = msg => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 4500); };
map.on("overlayadd", e => { if (e.layer === prefLayer || e.layer === cityLayer) toast("ℹ️ 境界線を表示すると、地図が少し重くなることがあります。重いときはオフにしてください。"); });
L.control.scale({ imperial:false }).addTo(map);
const layer = L.markerClusterGroup({ maxClusterRadius:70 }).addTo(map);
let userPos = null, sortNear = false;
// 所在地: 国土地理院の逆ジオコーダ(座標→市町村コード)+ 市町村名の表
let muniP = null;
const muniTable = () => muniP ||= (async () => {
  const t = await (await fetch("https://maps.gsi.go.jp/js/muni.js")).text(), tbl = {};
  for (const m of t.matchAll(/MUNI_ARRAY\["(\d+)"\]\s*=\s*'(\d+),([^,]*),(\d+),([^']*)'/g)) tbl[m[1]] = { pref:m[3], city:m[5].replace(/[\s\u3000]/g, "") };

async function areaOf(lat, lng) {
  try {
    const r = await (await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lon=${lng}&lat=${lat}`)).json();
    const t = await muniTable(), m = t && t[String(+r.results.muniCd)];
    return m ? `${m.pref} ${m.city}` : "";
  } catch { return ""; }
}
let filling = false;
async function backfillAreas() {   // 所在地が未取得の店を順に埋める(自分の投稿だけ、共有DBにも書き戻す)
  if (filling) return; filling = true; let changed = false;
  for (const s of shops) if (s.area == null) {
    const a = await areaOf(s.lat, s.lng);
    if (a) { s.area = a; changed = true; if (session && s.ownerId === session.user.id) sb.from('shops').update({ area:a }).eq('id', s.id).then(()=>{}); }
  }
  filling = false;
  if (changed) render();
}

// ===== 共有データベース(Supabase)との読み書き =====
async function loadCloud() {
  const [{ data: shopRows, error }, { data: profRows }, { data: likeRows }, { data: cmtRows }] = await Promise.all([
    sb.from('shops').select('*').order('created_at', { ascending:false }),
    sb.from('profiles').select('id,nickname,avatar'),
    sb.from('likes').select('shop_id,user_id'),
    sb.from('comments').select('shop_id'),
  ]);
  if (error) { toast("読み込みに失敗しました:" + error.message); return; }
  profilesById = Object.fromEntries((profRows || []).map(p => [p.id, p]));
  likesByShop = {};
  (likeRows || []).forEach(r => (likesByShop[r.shop_id] ||= new Set()).add(r.user_id));
  commentCountByShop = {};
  (cmtRows || []).forEach(r => commentCountByShop[r.shop_id] = (commentCountByShop[r.shop_id] || 0) + 1);
  shops = (shopRows || []).map(r => ({ id:r.id, ownerId:r.owner_id, name:r.name, genre:r.genre, rating:r.rating, status:r.status, skin:r.skin, price:r.price, comment:r.comment, area:r.area, lat:r.lat, lng:r.lng, photo:r.photo }));
  render();
}
function requireAuth() {   // ログイン・ニックネーム設定が済んでいなければ、その場で促す
  if (!session) { openLoginDialog(); return false; }
  if (!myProfile) { openProfileDialog(); return false; }
  return true;
}
async function toggleLike(s) {
  if (!requireAuth()) return;
  const uid = session.user.id, has = (likesByShop[s.id] || new Set()).has(uid);
  if (has) await sb.from('likes').delete().eq('shop_id', s.id).eq('user_id', uid);
  else await sb.from('likes').insert({ shop_id:s.id, user_id:uid });
  await loadCloud();
  markers[s.id]?.openPopup();
}
async function updateShopStatus(s) {
  const { error } = await sb.from('shops').update({ status: s.status === "want" ? "visited" : "want" }).eq('id', s.id).eq('owner_id', session.user.id);
  if (error) return alert("更新に失敗しました:" + error.message);
  await loadCloud();
}
async function deleteShop(id) {
  const { error } = await sb.from('shops').delete().eq('id', id).eq('owner_id', session.user.id);
  if (error) return alert("削除に失敗しました:" + error.message);
  await loadCloud();
}
async function loadComments(shopId, popupEl) {
  const box = popupEl.querySelector(".cmts"); if (!box) return;
  const { data } = await sb.from('comments').select('id,user_id,text,created_at').eq('shop_id', shopId).order('created_at');
  const rows = (data || []).map(c => { const p = profilesById[c.user_id] || {}; return `<div style="margin:4px 0;font-size:13px"><b>${p.avatar || "🐟"} ${esc(p.nickname || "名無しさん")}</b> ${esc(c.text)}</div>`; }).join("") || `<small style="color:var(--sub)">まだコメントはありません</small>`;
  box.innerHTML = `<div style="max-height:120px;overflow:auto;border-top:1px solid var(--line);margin-top:8px;padding-top:6px">${rows}</div>
    <div style="display:flex;gap:6px;margin-top:6px"><input data-cmtinput placeholder="コメントする" style="flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px"><button data-a="cmtsend" style="padding:6px 10px;font-size:13px">送信</button></div>`;
}
async function sendComment(s, popupEl) {
  if (!requireAuth()) return;
  const input = popupEl.querySelector("[data-cmtinput]"), text = input.value.trim(); if (!text) return;
  const { error } = await sb.from('comments').insert({ shop_id:s.id, user_id:session.user.id, text });
  if (error) return alert("送信に失敗しました:" + error.message);
  input.value = "";
  commentCountByShop[s.id] = (commentCountByShop[s.id] || 0) + 1;
  await loadComments(s.id, popupEl);
}

function renderRanking() {
  const box = $("rankBox"); if (!box || box.style.display === "none") return;
  const byId = Object.fromEntries(shops.map(s => [s.id, s]));
  const likeRank = Object.entries(likesByShop).map(([id, set]) => ({ id:+id, n:set.size })).filter(x => byId[x.id]).sort((a, b) => b.n - a.n).slice(0, 5);
  const postCounts = {}; shops.forEach(s => postCounts[s.ownerId] = (postCounts[s.ownerId] || 0) + 1);
  const postRank = Object.entries(postCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
  box.innerHTML = `
    <h4 style="margin:14px 16px 4px;font-size:14px;font-weight:500">🏆 人気ランキング</h4>
    ${likeRank.length ? likeRank.map((x, i) => `<div class="item" style="cursor:pointer" data-goto="${x.id}"><span>#${i + 1} ${esc(byId[x.id].name)}</span><span style="margin-left:auto;color:var(--accent)">❤${x.n}</span></div>`).join("") : `<div class="item" style="color:var(--sub)">まだいいねがありません</div>`}
    <h4 style="margin:14px 16px 4px;font-size:14px;font-weight:500">📮 投稿数ランキング</h4>
    ${postRank.length ? postRank.map(([uid, n], i) => { const p = profilesById[uid] || {}; return `<div class="item"><span>#${i + 1} ${p.avatar || "🐟"} ${esc(p.nickname || "名無しさん")}</span><span style="margin-left:auto;color:var(--accent)">${n}件</span></div>`; }).join("") : `<div class="item" style="color:var(--sub)">まだ投稿がありません</div>`}`;

$("rankBtn").onclick = () => { const box = $("rankBox"); box.style.display = box.style.display === "none" ? "block" : "none"; $("rankBtn").classList.toggle("on"); renderRanking(); };
const dist = (a, b) => { const R = 6371000, r = Math.PI/180, dLa = (b.lat-a.lat)*r, dLn = (b.lng-a.lng)*r;
  const h = Math.sin(dLa/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
const fmtD = m => m < 1000 ? Math.round(m) + "m" : (m/1000).toFixed(1) + "km";
const markers = {};

function visible(s){
  const q = $("q").value.trim().toLowerCase();
  if (activeGenres.size && !activeGenres.has(s.genre)) return false;
  return !q || (s.name + s.comment + (s.area || "")).toLowerCase().includes(q);
}

function render(){
  layer.clearLayers();
  const list = $("list"); list.innerHTML = "";
  const shown = shops.filter(visible);
  if (sortNear && userPos) shown.sort((a, b) => dist(userPos, a) - dist(userPos, b));
  shown.forEach(s => {
    const c = GENRES[s.genre] || GENRES["その他"];
    const icon = L.divIcon({ className:"", iconSize:[96,59], iconAnchor:[22,54], popupAnchor:[0,-52],
      html:`<div class="taiyaki-pin ${s.status}">${taiyakiSvg(c)}</div>` });
    const m = L.marker([s.lat, s.lng], { icon }).addTo(layer).bindPopup(() => popupHtml(s));
    markers[s.id] = m;
    const owner = profilesById[s.ownerId] || {};
    const likeN = (likesByShop[s.id] || new Set()).size, cmtN = commentCountByShop[s.id] || 0;
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `${s.photo?`<img src="${s.photo}">`:""}<div><b>${esc(s.name)}</b><small>${owner.nickname?`${owner.avatar||"🐟"} ${esc(owner.nickname)}・`:""}${s.area?`📍 ${esc(s.area)}<br>`:"<br>"}${esc(s.genre)} ${s.skin||""} ${s.price?s.price+"円":""} ${"★".repeat(s.rating)} ${s.status==="want"?"・食べたい":""}${likeN?` ・❤${likeN}`:""}${cmtN?` ・💬${cmtN}`:""}${userPos?`<span class="dist">${fmtD(dist(userPos, s))}</span>`:""}</small></div>`;
    el.onclick = () => { if (innerWidth <= 700) closeDrawer(); map.setView([s.lat, s.lng], Math.max(map.getZoom(), 15)); m.openPopup(); };
    list.appendChild(el);
  });
  if (!list.children.length) list.innerHTML = `<div class="item">まだ投稿がありません。最初のたい焼き店を追加してみましょう!</div>`;
  updateAuthUI();
  renderRanking();
}

function popupHtml(s){
  const d = document.createElement("div"); d.className = "popup";
  const owner = profilesById[s.ownerId] || {};
  const likes = likesByShop[s.id] || new Set();
  const iLiked = session && likes.has(session.user.id);
  const isOwner = session && session.user.id === s.ownerId;
  d.innerHTML = `<b>${esc(s.name)}</b><br>
    <span style="color:var(--sub);font-size:13px">${owner.avatar||"🐟"} ${esc(owner.nickname||"名無しさん")}${s.area?` ・📍 ${esc(s.area)}`:""}</span><br>
    ${esc(s.genre)}・${esc(s.skin||"")}${s.price?"・"+s.price+"円":""} ${"★".repeat(s.rating)}${s.photo?`<img src="${s.photo}">`:""}<p style="margin:4px 0">${esc(s.comment)}</p>
    <div class="row">
      <button data-a="like" class="${iLiked?"":"sub"}">${iLiked?"❤":"🤍"} ${likes.size||""}</button>
      <button data-a="route" class="sub">ここへ行く</button>
      ${isOwner?`<button data-a="toggle" class="sub">${s.status==="want"?"✔ 食べた!":"食べたいに戻す"}</button><button data-a="edit" class="sub">編集</button><button data-a="del" class="sub">削除</button>`:""}
    </div>
    <a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}">経路を見る</a>
    <div class="cmts"><small style="color:var(--sub)">コメントを読み込み中…</small></div>`;
  d.onclick = e => {
    const a = e.target.dataset.a; if (!a) return;
    if (a === "like") return toggleLike(s);
    if (a === "cmtsend") return sendComment(s, d);
    if (a === "route") { map.closePopup(); startRoute(s); return; }
    if (!isOwner) return;
    if (a === "toggle") return updateShopStatus(s);
    if (a === "del") { if (confirm("削除しますか?")) deleteShop(s.id); return; }
    if (a === "edit") { map.closePopup(); openDialog(s); return; }
  };
  loadComments(s.id, d);
  return d;
}

function renderChips(){
  const box = $("chips"); box.innerHTML = "";
  const mk = (label, c, on, fn) => { const b = document.createElement("button"); b.className = "chip" + (on?" on":""); b.style.setProperty("--c", c); b.textContent = label; b.onclick = fn; box.appendChild(b); };

  Object.entries(GENRES).forEach(([g,c]) => mk(g, c, activeGenres.has(g), () => { activeGenres.has(g) ? activeGenres.delete(g) : activeGenres.add(g); renderChips(); render(); }));
}

// ===== 場所の検索(国土地理院の住所検索。キー不要) =====
async function geoNominatim(q) {   // 駅名・施設名に強い
  const n = await (await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&accept-language=ja&q=" + encodeURIComponent(q))).json();
  if (!n.length) return null;
  const parts = n[0].display_name.split(",");
  return { lat:+n[0].lat, lng:+n[0].lon, name:parts.slice(0, 2).join(" "), short:n[0].name || parts[0] };
}
async function geoGsi(q) {          // 番地までの住所に強い
  const r = await (await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(q))).json();
  if (!r.length) return null;
  const [lng, lat] = r[0].geometry.coordinates;
  return { lat, lng, name: r[0].properties.title, short: "" };
}
async function geocode(q) {
  // 全角の数字・ハイフンを半角にそろえる
  q = q.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[－−‐―]/g, "-").trim();
  const order = /\d/.test(q) ? [geoGsi, geoNominatim] : [geoNominatim, geoGsi];   // 番号入り=住所とみなす
  for (const f of order) { try { const g = await f(q); if (g) return g; } catch {} }
  return null;
}
$("placebtn").onclick = async () => {

  catch { alert("検索に失敗しました"); }

// ===== ルート案内(徒歩・自転車・車) =====
const MODES = { foot:["徒歩","routed-foot"], bike:["自転車","routed-bike"], car:["車","routed-car"] };
let routeLine = null, routeShop = null, routeMode = "foot";
function panel(html) { const p = $("panel"); p.innerHTML = html; p.style.display = html ? "block" : "none"; }
function clearRoute() { if (routeLine) map.removeLayer(routeLine); routeLine = routeShop = null; panel(""); }
async function startRoute(s, mode) {
  routeShop = s; routeMode = mode || routeMode;
  if (!userPos) {
    panel("現在地を取得中…");
    try { await new Promise((ok, ng) => navigator.geolocation.getCurrentPosition(p => { userPos = { lat:p.coords.latitude, lng:p.coords.longitude }; ok(); }, ng, { enableHighAccuracy:true })); }
    catch { panel(`現在地を取得できませんでした。<br><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}">Googleマップで経路を見る</a> <button class="sub" onclick="clearRoute()">閉じる</button>`); return; }
  }
  const [label, srv] = MODES[routeMode];
  const url = `https://routing.openstreetmap.de/${srv}/route/v1/driving/${userPos.lng},${userPos.lat};${s.lng},${s.lat}?overview=full&geometries=geojson`;
  let info;
  try {
    const r = (await (await fetch(url)).json()).routes[0];
    if (routeLine) map.removeLayer(routeLine);
    routeLine = L.geoJSON(r.geometry, { style:{ color:"#1a73e8", weight:6, opacity:.85 } }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { padding:[50,50] });
    info = `${label}:<b>${fmtD(r.distance)}</b>・約<b>${Math.max(1, Math.round(r.duration/60))}分</b>`;
  } catch {
    if (routeLine) map.removeLayer(routeLine);
    routeLine = L.polyline([userPos, s], { color:"#1a73e8", weight:4, dashArray:"8 8" }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { padding:[50,50] });
    info = `道順を取得できず直線距離のみ:<b>${fmtD(dist(userPos, s))}</b>`;
  }
  const btn = k => `<button class="${k===routeMode?"":"sub"}" onclick="startRoute(routeShop,'${k}')">${MODES[k][0]}</button>`;
  panel(`<b>${esc(s.name)}</b>まで<br>${info}<div class="modes">${btn("foot")}${btn("bike")}${btn("car")}</div><button class="sub" onclick="clearRoute()">ルートを消す</button>`);
}

// ===== 距離を測る =====
let measuring = false, mPts = [], mLine = null, mDots = [];
function endMeasure() { measuring = false; mPts = []; if (mLine) map.removeLayer(mLine); mDots.forEach(d => map.removeLayer(d)); mLine = null; mDots = []; $("measure").classList.remove("on"); $("measure").textContent = "距離を測る"; panel(""); }
$("measure").onclick = () => {
  if (measuring) return endMeasure();
  measuring = true; picking = false; $("hint").style.display = "none";
  $("measure").classList.add("on"); $("measure").textContent = "測定を終える";
  panel("地図をクリックして地点を順に選んでください");
};
map.on("click", e => {
  if (!measuring) return;
  mPts.push(e.latlng); mDots.push(L.circleMarker(e.latlng, { radius:5, color:"#d9480f" }).addTo(map));
  if (mLine) map.removeLayer(mLine);
  mLine = L.polyline(mPts, { color:"#d9480f", weight:4 }).addTo(map);
  let t = 0; for (let i = 1; i < mPts.length; i++) t += dist(mPts[i-1], mPts[i]);
  panel(`合計距離:<b>${fmtD(t)}</b>(徒歩で約${Math.max(1, Math.round(t/80))}分)`);
});

// ===== 各市区の主要駅(目印ピン)=====
// 東京都・埼玉県・千葉県・神奈川県の市・区ごとに1駅。データは STATIONS(下)に内蔵。選んだときだけ描く
const stnLayer = L.layerGroup();
let stnBuilt = false;
const buildStations = () => {
  if (stnBuilt) return; stnBuilt = true;
  STATIONS.forEach(([muni, name, lat, lng]) => {
    L.marker([lat, lng], { icon:L.divIcon({ className:"", html:'<div class="stn"></div>', iconSize:[14,14], iconAnchor:[7,7] }), keyboard:false, zIndexOffset:-500 })
      .bindTooltip(name, { permanent:true, direction:"right", offset:[8,0], className:"stn-label" })
      .bindPopup(`<b>${esc(name)}</b><br><span style="color:#5f6368;font-size:13px">${esc(muni)}の主要駅</span>`)
      .addTo(stnLayer);
  });
};
const stnLabels = () => {   // 引いた画面では駅名を隠して軽くする
  const show = map.getZoom() >= 11;
  stnLayer.eachLayer(m => m.getTooltip() && (show ? m.openTooltip() : m.closeTooltip()));
};
map.on("zoomend", () => map.hasLayer(stnLayer) && stnLabels());
$("stnBtn").onclick = () => {
  if (map.hasLayer(stnLayer)) { map.removeLayer(stnLayer); $("stnBtn").classList.remove("on"); }
  else { buildStations(); map.addLayer(stnLayer); stnLabels(); $("stnBtn").classList.add("on"); }
  try { localStorage.setItem("shopmap.stn", map.hasLayer(stnLayer) ? "1" : "0"); } catch {}
};
try { if (localStorage.getItem("shopmap.stn") === "1") $("stnBtn").click(); } catch {}

// ===== 境界線の切替ボタン =====
document.querySelectorAll("[data-line]").forEach(b => b.onclick = () => {
  const l = b.dataset.line === "pref" ? prefLayer : cityLayer;
  map.hasLayer(l) ? map.removeLayer(l) : map.addLayer(l);
});
syncLines();

// ===== メニュー(左パネル/下シート) =====
const drawer = $("drawer"), closeDrawer = () => drawer.classList.remove("open");
$("menu").onclick = () => drawer.classList.toggle("open");
$("close").onclick = closeDrawer;
// ===== お店の追加(3つの入り口 + 長押し) =====
const addmenu = $("addmenu"), closeAdd = () => addmenu.classList.remove("open");
const startPick = () => { pending = null; picking = true; $("hint").style.display = "block"; };
const stopPick = () => { picking = false; $("hint").style.display = "none"; };
$("add").onclick = e => { e.stopPropagation(); if (!requireAuth()) return; if (innerWidth <= 700) closeDrawer(); stopPick(); addmenu.classList.toggle("open"); };
document.addEventListener("click", e => { if (!addmenu.contains(e.target)) closeAdd(); });
$("addMap").onclick = () => { closeAdd(); startPick(); };
$("hintx").onclick = stopPick;
document.addEventListener("keydown", e => { if (e.key === "Escape") { stopPick(); closeAdd(); } });
$("addSearch").onclick = () => { closeAdd(); $("place").focus(); $("place").placeholder = "例: 浅草駅 / 東京都台東区…"; };
$("addHere").onclick = () => {
  closeAdd();
  if (!navigator.geolocation) return alert("この端末では位置情報が使えません");
  navigator.geolocation.getCurrentPosition(
    p => { pending = { lat:p.coords.latitude, lng:p.coords.longitude }; openDialog(); $("geores").textContent = "📍 いまいる場所"; map.setView([pending.lat, pending.lng], 17); },
    () => alert("現在地を取得できませんでした。位置情報の許可を確認してください"), { enableHighAccuracy:true });
};
// 地図の長押し(PCは右クリック)でも、その場所に仮ピンを立てて登録できる
map.on("contextmenu", e => showSearchPin({ lat:e.latlng.lat, lng:e.latlng.lng, name:"選んだ場所", short:"" }, true));
$("place").addEventListener("focus", () => { if (innerWidth <= 700) closeDrawer(); });

// ===== 起動処理: ログイン状態の確認 → 共有データの読み込み =====
sb.auth.onAuthStateChange((event, s) => {
  session = s;
  if (event === "SIGNED_IN") { history.replaceState(null, "", location.pathname + location.search); ensureProfile(); }
  if (event === "SIGNED_OUT") myProfile = null;
  updateAuthUI();
});
(async () => {
  const { data:{ session:s0 } } = await sb.auth.getSession();
  session = s0;
  if (session) await ensureProfile();
  renderChips();
  await loadCloud();
  backfillAreas();
})();
</script>
